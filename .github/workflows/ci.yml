name: CI

# Lint, test, and build qrl-web3-wallet on push/PR.
#
# Release artifacts (the Chrome extension .zip) are produced separately by
# `build.yaml`, which fires on `release: created` and uploads to the GitHub
# Release. semantic-release in `release.yml` triggers that flow.

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6 (resolved 2026-08-17). Mutable tags are not
        # used: any future bump must update the SHA explicitly so that a
        # tag-rewrite cannot inject untrusted code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Checkout tested QuantaSwap frontend
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: DigitalGuards/QuantaSwap
          # Immutable origin/dev commit tested by this extension composition.
          ref: 46a8c7b43dd47f65049d1e663b9775e6f7c2cc62
          path: quantaswap

      - name: Install QuantaSwap frontend dependencies
        working-directory: quantaswap/frontend
        run: npm ci --no-audit --no-fund

      - name: Build QuantaSwap frontend
        working-directory: quantaswap/frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser integration
        run: npx playwright test
        env:
          QUANTASWAP_FRONTEND_DIR: ${{ github.workspace }}/quantaswap/frontend
